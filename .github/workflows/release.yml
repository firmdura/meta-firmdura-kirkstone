name: Approve and sign frozen release assets

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Fixture smoke is NOT release evidence
        type: choice
        options:
          - fixture
          - release
        default: fixture
        required: true
      artifact_id:
        description: Optional Actions artifact ID for ZIP input (blank downloads staged draft release)
        type: string
      manifest_sha256:
        description: Independently approved SHA-256 of the exact manifest bytes
        type: string
        required: true
      release_id:
        description: Independently approved release ID from the manifest
        type: string
        required: true
      source_commit:
        description: Independently approved 40-character source commit from the manifest
        type: string
        required: true

permissions: {}

concurrency:
  group: release-signing
  cancel-in-progress: false

jobs:
  approval-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require trusted main and existing human approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/approval.py

  sign:
    needs: approval-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      KIND: ${{ inputs.kind }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Recheck protection after human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/approval.py
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Copy only the labelled fixture bytes
        if: inputs.kind == 'fixture'
        run: |
          test -z "$ARTIFACT_ID"
          cp -R tests/release-fixtures/unsigned candidate
      - name: Download exact frozen candidate as data, never execute it
        if: inputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ARTIFACT_ID" ]; then
            [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/firmdura/meta-firmdura-kirkstone/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
            python3 scripts/release/verify.py unpack --archive candidate.zip --assets candidate \
              --manifest-sha256 "$MANIFEST_SHA256" --kind "$KIND" \
              --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
          else
            python3 scripts/release/verify.py stage-download --assets candidate \
              --manifest-sha256 "$MANIFEST_SHA256" --kind "$KIND" \
              --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
          fi
      - name: Check every frozen byte against the approved manifest
        run: |
          python3 scripts/release/verify.py check --assets candidate \
            --manifest-sha256 "$MANIFEST_SHA256" --kind "$KIND" \
            --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
      - name: Sign exact manifest with GitHub OIDC, without a stored key
        run: |
          cosign sign-blob --yes --oidc-provider github-actions \
            --bundle candidate/manifest.sigstore.json candidate/manifest.json
      - name: Verify exact issuer, workflow identity and complete asset set
        run: |
          python3 scripts/release/verify.py verify --assets candidate \
            --manifest-sha256 "$MANIFEST_SHA256" --kind "$KIND" \
            --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
      - name: Real OIDC fixture controls (not release evidence)
        if: inputs.kind == 'fixture'
        run: |
          python3 tests/release_oidc.py --assets candidate \
            --manifest-sha256 "$MANIFEST_SHA256" --kind fixture \
            --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
      - name: Retain signed candidate, without publishing a release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ inputs.kind }}-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
