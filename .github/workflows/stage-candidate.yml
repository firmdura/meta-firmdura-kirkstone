name: Stage verified unsigned release candidate artifact

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: Approved SHA-256 of the exact manifest bytes
        type: string
        required: true
      release_id:
        description: Approved unpublished draft release ID
        type: string
        required: true
      source_commit:
        description: Approved 40-character source commit from the manifest
        type: string
        required: true

permissions: {}

concurrency:
  group: stage-release-candidate
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub REST API hides draft=true releases unless token has contents: write;
    # this non-OIDC job has no id-token and executes only read/verify + upload-artifact.
    permissions:
      contents: write
    env:
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Require trusted main dispatch
        run: |
          test "${GITHUB_REPOSITORY:-}" = "firmdura/meta-firmdura-kirkstone"
          test "${GITHUB_REF:-}" = "refs/heads/main"
          test "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download and check every byte of the unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/verify.py stage-download --assets candidate \
            --manifest-sha256 "$MANIFEST_SHA256" --kind release \
            --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT"
      - name: Upload verified unsigned candidate as immutable Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
